name: Release
on:
  push: { tags: ['v*'] }
jobs:
  publish:
    runs-on: ubuntu-latest
    # The `release` environment is the anti-accident gate: pushing a tag parks
    # this run pending a reviewer's approval rather than publishing outright.
    # It is configured — `v*` tag deployment-branch policy, required reviewer.
    #
    # Auth is npm trusted publishing over OIDC: the publisher registered on
    # npmjs.com names this repo, this workflow filename and this environment,
    # and the id-token below is what proves all three. There is no NPM_TOKEN —
    # nothing to leak, rotate, or expire.
    #
    # All three names are load-bearing. Renaming this file, changing the
    # `environment:` value, or moving the repo breaks the publish until the
    # registration on npm is updated to match — and npm does not validate a
    # registration when it is saved, so a mismatched one looks correct in the UI
    # and fails only here.
    #
    # It fails as `E404 ... PUT /xmtp-chat-rn - Not found`, which reads like a
    # missing package rather than an auth problem: OIDC is tried first, and when
    # no publisher matches, npm falls back to the `.npmrc` that setup-node wrote,
    # whose token is an unset `${NODE_AUTH_TOKEN}` placeholder. npm answers an
    # unauthorised write to an existing package with 404, not 403. The signed
    # provenance line above it proves only that `id-token: write` works; it is a
    # separate exchange with sigstore and says nothing about npm write access.
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
      # A tag name feeds nothing into the publish — npm takes the version from
      # package.json — so the two drift silently and the mismatch surfaces only
      # as one `npm notice version:` line under a few hundred lines of file
      # listing. v0.0.3 published 0.0.2 that way. Fail before the build instead.
      - name: Tag must match the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME would publish $pkg. Bump package.json to $tag, or retag as v$pkg."
            exit 1
          fi
          echo "Publishing $pkg as $GITHUB_REF_NAME"
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      # prepublishOnly re-runs typecheck + tests + build, so a tag can never
      # publish something that does not pass what CI passes.
      - run: npm publish --provenance
