name: Release
on:
  push: { tags: ['v*'] }
jobs:
  publish:
    runs-on: ubuntu-latest
    # The `release` environment is the anti-accident gate: pushing a tag parks
    # this run pending a reviewer's approval rather than publishing outright.
    # It is configured — `v*` tag deployment-branch policy, required reviewer.
    #
    # Authentication is NOT yet configured, and cannot be until this package
    # exists on npm: a trusted publisher is registered on a package's settings
    # page, and npm has no way to pre-register one for a name that has never
    # been published (npm/cli#8544). So the FIRST publish needs a token —
    # add `env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }` to the publish
    # step below, tag, approve. Then register the trusted publisher (this repo,
    # this workflow filename, this environment) and delete both the env block
    # and the secret; every release after that authenticates over OIDC with no
    # token to leak or rotate.
    environment: release
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      # prepublishOnly re-runs typecheck + tests + build, so a tag can never
      # publish something that does not pass what CI passes.
      - run: npm publish --provenance    # auth via OIDC; no NPM_TOKEN needed
